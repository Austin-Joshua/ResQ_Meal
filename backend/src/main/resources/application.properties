server.port=${PORT:8080}
server.forward-headers-strategy=NATIVE
spring.application.name=resqmeal

# Surface application errors in the terminal (Spring default is often INFO-only for framework noise).
logging.level.com.resqmeal=INFO
logging.level.com.resqmeal.exception.GlobalExceptionHandler=WARN

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:resqmeal_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_LIMIT:10}
# Allow Tomcat to start before MySQL is reachable (e.g. Docker still booting). Set to 1 in strict prod if desired.
spring.datasource.hikari.initialization-fail-timeout=-1

jwt.secret=${JWT_SECRET:default-secret-key-change-in-production}
jwt.expiration-days=7

app.force-https=${FORCE_HTTPS:false}

# Programmatic auth rate limiting is configured in RateLimitConfig (disable starter auto-filters)
bucket4j.enabled=false

app.upload-dir=${UPLOAD_DIR:uploads}
app.api-public-base-url=${API_URL:http://localhost:8080}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

matching.distance-weight=0.40
matching.freshness-weight=0.30
matching.capacity-weight=0.20
matching.food-type-weight=0.10

socketio.port=${PORT:8080}
socketio.host=${SOCKETIO_HOST:0.0.0.0}

freshness.ai-url=${FRESHNESS_AI_URL:}
freshness.env-ai-url=${FRESHNESS_ENV_AI_URL:}
food.image-recognition-url=${FOOD_IMAGE_RECOGNITION_URL:}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

spring.cache.type=caffeine

# Security monitoring (comma-separated user IDs from users.id with ROLE_ADMIN + /api/admin access)
app.security.admin-user-ids=${ADMIN_USER_IDS:}
app.security.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
app.security.telegram-chat-id=${TELEGRAM_CHAT_ID:}
app.security.max-failed-logins-per-minute=${APP_SECURITY_MAX_FAILED_LOGINS_PER_MINUTE:5}
app.security.max-mutations-per-minute=${APP_SECURITY_MAX_MUTATIONS_PER_MINUTE:20}

# Traffic ML security layer (Phase A–C service). Set enabled=true and run ml/traffic-security/server.py
app.traffic-security.enabled=${TRAFFIC_SECURITY_ML_ENABLED:false}
app.traffic-security.ml-service-base-url=${TRAFFIC_SECURITY_ML_URL:http://127.0.0.1:8091}
app.traffic-security.max-body-bytes=${TRAFFIC_SECURITY_MAX_BODY_BYTES:65536}
app.traffic-security.connect-timeout-ms=${TRAFFIC_SECURITY_CONNECT_TIMEOUT_MS:500}
app.traffic-security.read-timeout-ms=${TRAFFIC_SECURITY_READ_TIMEOUT_MS:8000}
app.traffic-security.firebase-webhook-url=${FIREBASE_SECURITY_WEBHOOK_URL:}
app.traffic-security.firebase-webhook-secret=${FIREBASE_SECURITY_WEBHOOK_SECRET:}
app.traffic-security.block-on-malicious=${TRAFFIC_SECURITY_BLOCK_ON_MALICIOUS:false}

# Threat attack simulation + Telegram command bot
app.attack-sim.enabled=${ATTACK_SIM_ENABLED:true}
app.attack-sim.telegram-bot-enabled=${ATTACK_SIM_TELEGRAM_BOT_ENABLED:true}
app.attack-sim.backup-schema=${ATTACK_SIM_BACKUP_SCHEMA:resqmeal_backup}
app.attack-sim.authorized-telegram-user-ids=${ATTACK_SIM_AUTHORIZED_TELEGRAM_USER_IDS:}
app.attack-sim.bot-poll-delay-ms=${ATTACK_SIM_BOT_POLL_DELAY_MS:3000}
app.attack-sim.backup-sync-delay-ms=${ATTACK_SIM_BACKUP_SYNC_DELAY_MS:15000}

# Firebase / Google sign-in (optional)
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
