# Local fullstack: MySQL for Spring Boot (schema loaded on first container data volume only).
# Host port 3307 avoids clashing with a MySQL already bound to 3306 on the machine.
# Usage: docker compose up -d db
# Then set backend/.env: DB_PORT=3307 (and DB_PASSWORD to match MYSQL_ROOT_PASSWORD below).
services:
  db:
    image: mysql:8.0
    container_name: resqmeal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: resqmeal_db
    ports:
      - "3307:3306"
    volumes:
      - resqmeal_mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

volumes:
  resqmeal_mysql_data:
